<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1: 入力欄をタップしたときに iOS が勝手に拡大するのを防ぐ（ピンチでの拡大はできる） -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>漫画進捗管理</title>
<meta name="description" content="漫画制作のページごとの作業時間と締切までの残り時間を管理するツール。データは端末内だけに保存されます。">
<meta name="theme-color" content="#26282f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="漫画進捗">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="tb-left">
    <select id="epSelect" title="話を選択"></select>
    <button id="btnNewEp" class="btn">＋ 新しい話</button>
    <button id="btnEditEp" class="btn ghost" title="話の設定">設定</button>
  </div>
  <nav class="tabs">
    <button data-view="main" class="tab on">進捗</button>
    <button data-view="history" class="tab">履歴</button>
  </nav>
  <div class="tb-right">
    <button id="btnPdf" class="btn ghost" title="原稿PDFを取り込み">PDF取込</button>
    <button id="btnCsv" class="btn ghost" title="CSV出力・バックアップ・復元">データ</button>
    <button id="btnUndo" class="btn ghost" title="直前操作の取消" disabled>↶ 取消</button>
    <a class="btn ghost" href="./help.html" title="使い方">？</a>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
    <!-- iOS は .json を accept で指定すると選べなくなることがあるので指定しない -->
    <input type="file" id="restoreInput" hidden>
  </div>
</header>

<div id="notice" class="notice" hidden></div>
<div id="activeBar" class="activebar" hidden></div>

<main id="viewMain">
  <section id="summary" class="summary"></section>
  <div class="gridtools">
    <span id="epInfo" class="muted"></span>
    <label class="muted zoom">表示サイズ <input type="range" id="zoom" min="110" max="280" step="10"></label>
  </div>
  <section id="grid" class="grid"></section>
  <div id="empty" class="empty" hidden>
    <p><b>漫画進捗管理へようこそ</b></p>
    <p class="muted">ページごとの作業時間を記録して、締切までの残り時間とこれからの作業量をひと目で確認できます。</p>
    <button class="btn primary" id="btnNewEp2">＋ 新しい話を作成</button>
    <p class="muted">原稿PDFを取り込んで始めることもできます（右上の「PDF取込」）。</p>
    <p class="muted" style="font-size:12px">データはこの端末の中だけに保存され、外部には送信されません。<a href="./help.html">使い方</a></p>
  </div>
</main>

<main id="viewHistory" hidden>
  <nav class="subtabs">
    <button data-hview="episodes" class="subtab on">話別</button>
    <button data-hview="days" class="subtab">日別</button>
  </nav>
  <div class="hwrap">
    <aside id="hList" class="hlist"></aside>
    <section id="hDetail" class="hdetail"></section>
  </div>
</main>

<div id="compactRoot"></div>
<div id="dropOverlay" class="drop" hidden><div>PDFをドロップしてサムネイルを更新</div></div>
<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
